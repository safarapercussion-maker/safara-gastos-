name: Comprobación diaria SAFARA pruebas

on:
  schedule:
    # Cada seis horas: evita periodos de inactividad largos sin generar tráfico
    # continuo. GitHub puede retrasar un disparo, por eso no se usa un intervalo
    # de doce horas exacto.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-aplicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Abrir aplicación de pruebas
        run: >-
          curl --fail --silent --show-error --location
          --retry 3 --retry-delay 10 --retry-all-errors
          --connect-timeout 20 --max-time 120
          https://safara-test-seguridad.streamlit.app/
