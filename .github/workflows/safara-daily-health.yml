name: Comprobación diaria SAFARA pruebas

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-aplicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Abrir aplicación de pruebas
        run: >-
          curl --fail --silent --show-error --location
          --retry 3 --retry-delay 10 --retry-connrefused
          https://safara-test-seguridad.streamlit.app/
