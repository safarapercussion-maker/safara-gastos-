# Copia este archivo como .streamlit/secrets.toml en local o añade el valor
# equivalente en los Secrets de la aplicación Streamlit de pruebas.
# Usa un valor aleatorio de al menos 32 caracteres y no lo subas al repositorio.
bootstrap_admin_token = "REEMPLAZA_ESTE_VALOR_POR_UN_SECRETO_ALEATORIO_DE_32_O_MAS_CARACTERES"

# Persistencia principal de pruebas: Supabase/PostgreSQL.
# La URL privada se obtiene desde la sección Connect de Supabase y se pega
# exclusivamente en Streamlit Secrets; jamás se sube a GitHub.
enable_supabase_storage = false
# database_url = "postgresql://..."

# Google conserva solo los justificantes y los futuros informes. Los datos
# críticos se guardan en Supabase cuando la opción anterior está activada.
enable_google_sheets_sync = false

# Cuando se autorice la persistencia de pruebas en Google, activa la opción y
# copia únicamente los identificadores creados para esta fase. Nunca subas este
# archivo con valores reales al repositorio.
# enable_google_sheets_sync = true
#
# [safara_google_storage]
# spreadsheet_id = "REEMPLAZA_POR_EL_ID_DE_LA_HOJA"
# receipts_folder_id = "REEMPLAZA_POR_EL_ID_DE_LA_CARPETA"
#
# Opción recomendada: pega aquí el CONTENIDO COMPLETO del JSON descargado,
# entre las tres comillas simples. No subas nunca el archivo JSON al repositorio.
# gcp_service_account_json = '''
# { "type": "service_account", "project_id": "..." }
# '''
#
# Opción alternativa: campos TOML individuales.
# [gcp_service_account]
# type = "service_account"
# project_id = "REEMPLAZA_POR_EL_PROYECTO"
# private_key_id = "REEMPLAZA_POR_EL_ID_DE_LA_CLAVE"
# private_key = "-----BEGIN PRIVATE KEY-----\\nREEMPLAZA_ESTA_CLAVE\\n-----END PRIVATE KEY-----\\n"
# client_email = "cuenta-tecnica@proyecto.iam.gserviceaccount.com"
# client_id = "REEMPLAZA_POR_EL_CLIENT_ID"
# auth_uri = "https://accounts.google.com/o/oauth2/auth"
# token_uri = "https://oauth2.googleapis.com/token"
# auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
# client_x509_cert_url = "REEMPLAZA_POR_LA_URL_DEL_CERTIFICADO"
# universe_domain = "googleapis.com"

# Autorización de Drive en nombre de la cuenta propietaria de SAFARA.
# Se usa solo para justificantes; la cuenta técnica anterior mantiene los informes de Sheets.
# Crea un cliente OAuth de tipo "Aplicación web" y registra exactamente la URL indicada.
# La clave de cifrado debe ser una clave Fernet nueva: no reutilices contraseñas.
# [safara_google_drive_oauth]
# client_id = "REEMPLAZA_POR_EL_CLIENT_ID_OAUTH"
# client_secret = "REEMPLAZA_POR_EL_SECRETO_OAUTH"
# redirect_uri = "https://safara-test-seguridad.streamlit.app/"
# encryption_key = "REEMPLAZA_POR_UNA_CLAVE_FERNET_PRIVADA"

