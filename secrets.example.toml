# Copia este archivo como .streamlit/secrets.toml en local o añade el valor
# equivalente en los Secrets de la aplicación Streamlit de pruebas.
# Usa un valor aleatorio de al menos 32 caracteres y no lo subas al repositorio.
bootstrap_admin_token = "REEMPLAZA_ESTE_VALOR_POR_UN_SECRETO_ALEATORIO_DE_32_O_MAS_CARACTERES"

# Google Sheets queda desactivado por defecto. Solo activa esta opción cuando
# se autorice expresamente la integración y las credenciales estén revisadas.
enable_google_sheets_sync = false
